buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.4.20"
        // AsyncStorage 3.1.1 has no Kotlin 2.4 mapping and otherwise falls
        // back to KSP1. Keep the KSP2 override in this tracked build file.
        kspVersion = "2.3.9"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://notifee.github.io/maven" }
        maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
        maven { url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
    }

    // AGP 9 turns the BuildConfig feature off by default and removed the global
    // `android.defaults.buildfeatures.buildconfig` opt-in. Our app (BuildConfig.
    // VERSION_NAME in MainApplication.kt) and several third-party RN modules
    // (e.g. react-native-battery-optimization-check) declare BuildConfig fields
    // and fail configuration without it, so re-enable it on every Android module.
    afterEvaluate {
        if (it.hasProperty("android")) {
            it.android.buildFeatures.buildConfig = true
        }
    }

}

apply plugin: "com.facebook.react.rootproject"
